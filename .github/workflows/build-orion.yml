name: Build ORION + wolf firmware

# LODESTAR ORION (public repo) with the wolf pet as the first screen after the splash.
# Lives in this private repo so the wolf code stays private.
on:
  workflow_dispatch:
    inputs:
      units:
        description: "Speed units: metric (km/h) or mph"
        type: choice
        default: metric
        options: [metric, mph]
      species:
        description: "Which pet"
        type: choice
        default: wolf
        options: [wolf, fox, cat, bear, butterfly, gator, croc, pig]
      env:
        description: "PlatformIO environment (the radio). Default is the Heltec V4"
        type: string
        default: heltec_v4_companion_radio_ble
      board:
        description: "Short name of the radio, used in file names (e.g. heltec-v4, rak4631)"
        type: string
        default: heltec_v4
      kind:
        description: "Chip family: esp32 or nrf52"
        type: choice
        default: esp32
        options: [esp32, nrf52]
      meshcore_ref:
        description: "MeshCore commit to build on"
        type: string
        default: 81dbae592ffad40b4212bc0b37e82b38da08f4bc
      release_tag:
        description: "Publish a release in this private repo with this tag (empty = just build)"
        type: string
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PIO_ENV: ${{ inputs.env }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: propertymonitor-web/lodestar_nova_alpha
          path: orion

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Get MeshCore
        env:
          MC_REF: ${{ inputs.meshcore_ref }}
        run: |
          git init mc
          cd mc
          git remote add origin https://github.com/meshcore-dev/MeshCore.git
          git fetch --depth 1 origin "$MC_REF"
          git checkout FETCH_HEAD

      - name: Wolf game-rule tests (PC build)
        run: |
          set -o pipefail
          SP=$(echo "${{ inputs.species }}" | tr a-z A-Z)
          g++ -std=c++17 -I src -I mc/src -DPET_$SP=1 test/host_sim.cpp src/WolfCore.cpp src/WolfScene.cpp src/WolfInsect.cpp -o host_sim
          ./host_sim logic | grep -v "\[alert\]"
          ./host_sim mix | grep -E "STUCK|stage"
          ./host_sim mirror mirror.txt

      - name: Apply ORION, then the wolf
        run: |
          python3 orion/tools/apply_nova.py --meshcore mc
          python3 tools/apply_orion_wolf.py --meshcore mc

      - name: Build firmware
        env:
          SPECIES: ${{ inputs.species }}
          UNITS: ${{ inputs.units }}
        run: |
          set -o pipefail
          SP=$(echo "$SPECIES" | tr a-z A-Z)
          export PLATFORMIO_BUILD_FLAGS="-DNOVA_ORION=1 -DPET_$SP=1 $([ "$UNITS" = mph ] && echo -DNOVA_MPH=1)"
          echo "flags: $PLATFORMIO_BUILD_FLAGS"
          pip install platformio
          cd mc
          if [ "${{ inputs.kind }}" = esp32 ]; then pio run -e "$PIO_ENV" -t mergebin 2>&1 | tee ../build.log; else pio run -e "$PIO_ENV" 2>&1 | tee ../build.log; fi

      - name: Show compile errors
        if: failure()
        run: |
          grep -E "error|undefined reference|No such file" build.log | head -25 | while IFS= read -r l; do
            echo "::error::${l:0:900}"
          done

      - name: Collect output
        run: |
          mkdir -p out
          B=mc/.pio/build/"$PIO_ENV"
          if [ "${{ inputs.kind }}" = esp32 ]; then
            cp $B/firmware-merged.bin out/
            cp $B/firmware.bin out/
          else
            cp $B/firmware.uf2 out/
            cp $B/firmware.zip out/ 2>/dev/null || true
          fi
          git -C mc rev-parse HEAD > out/meshcore_commit.txt
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: orion-${{ inputs.species }}-${{ inputs.board }}-${{ inputs.units }}
          path: out/

      - name: Publish release (private repo)
        if: ${{ inputs.release_tag != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag }}
          UNITS: ${{ inputs.units }}
          SPECIES: ${{ inputs.species }}
          BOARD: ${{ inputs.board }}
          KIND: ${{ inputs.kind }}
        run: |
          P="orion-$SPECIES-$BOARD-$UNITS"
          if [ "$KIND" = esp32 ]; then
            cp out/firmware-merged.bin "$P-merged.bin"; cp out/firmware.bin "$P-update.bin"; FILES="$P-merged.bin $P-update.bin"
          else
            cp out/firmware.uf2 "$P.uf2"; FILES="$P.uf2"
            if [ -f out/firmware.zip ]; then cp out/firmware.zip "$P-update.zip"; FILES="$FILES $P-update.zip"; fi
          fi
          gh release create "$TAG" $FILES --title "ORION + $SPECIES ($BOARD, $UNITS)" \
            --notes "LODESTAR ORION with the $SPECIES pet. Radio: $BOARD."
