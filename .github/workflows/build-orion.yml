name: Build ORION + wolf firmware

# LODESTAR ORION (public repo) with the wolf pet as the first screen after the splash.
# Lives in this private repo so the wolf code stays private.
on:
  workflow_dispatch:
    inputs:
      units:
        description: "Speed units: metric (km/h) or mph"
        type: choice
        default: metric
        options: [metric, mph]
      species:
        description: "Which pet (mesh = no pet + mesh analyzer; mysterymesh = mystery egg + mesh analyzer)"
        type: choice
        default: wolf
        options: [wolf, fox, cat, bear, butterfly, gator, croc, pig, donkey, unicorn, dragon, kitsune, griffin, phoenix, horse, mystery, mesh, mysterymesh]
      env:
        description: "PlatformIO environment (the radio). Default is the Heltec V4"
        type: string
        default: heltec_v4_companion_radio_ble
      board:
        description: "Short name of the radio, used in file names (e.g. heltec-v4, rak4631)"
        type: string
        default: heltec_v4
      kind:
        description: "Chip family: esp32 or nrf52"
        type: choice
        default: esp32
        options: [esp32, nrf52]
      mesh:
        description: "Add the Mesh Analyzer to any pet build"
        type: boolean
        default: false
      instant:
        description: "Private build: the pet is born at once (no egg)"
        type: boolean
        default: false
      tactical:
        description: "TACTICAL: sweeping radar on the OLED instead of the pet (needs a pet species + Mesh Analyzer; the pet keeps ageing)"
        type: boolean
        default: false
      meshcore_ref:
        description: "MeshCore commit to build on"
        type: string
        default: 81dbae592ffad40b4212bc0b37e82b38da08f4bc
      release_tag:
        description: "Publish a release in this private repo with this tag (empty = just build)"
        type: string
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PIO_ENV: ${{ inputs.env }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: propertymonitor-web/lodestar_nova_alpha
          path: orion

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Get MeshCore
        env:
          MC_REF: ${{ inputs.meshcore_ref }}
        run: |
          git init mc
          cd mc
          git remote add origin https://github.com/meshcore-dev/MeshCore.git
          git fetch --depth 1 origin "$MC_REF"
          git checkout FETCH_HEAD

      - name: Wolf game-rule tests (PC build)
        run: |
          set -o pipefail
          SP=$(echo "${{ inputs.species }}" | tr a-z A-Z)
          g++ -std=c++17 -I src -I mc/src -I test test/mesh_sim.cpp -o mesh_sim && ./mesh_sim | tail -2
          [ "$SP" = MYSTERYMESH ] && SP=MYSTERY
          g++ -std=c++17 -I src -I mc/src -I test test/tac_sim.cpp -o tac_sim && ./tac_sim | tail -2
          if [ "$SP" = MESH ]; then
            echo "no pet in this build"
          elif [ "$SP" = MYSTERY ]; then
            g++ -std=c++17 -I src -I mc/src -I test -DPET_MYSTERY=1 test/mystery_sim.cpp src/WolfCore.cpp src/Mystery[A-Z]*.cpp -o mystery_sim
            ./mystery_sim | tail -3
            g++ -std=c++17 -I src -I mc/src -I test -DPET_MYSTERY=1 test/cross_sim.cpp src/WolfCore.cpp -o cross_sim
            ./cross_sim | grep -v "\[alert\]" | tail -8
            g++ -std=c++17 -I src -I mc/src -I test test/hud_sim.cpp src/WolfCore.cpp -o hud_sim
            ./hud_sim | tail -3
          else
            g++ -std=c++17 -I src -I mc/src -I test -DPET_$SP=1 test/host_sim.cpp src/WolfCore.cpp src/WolfScene.cpp src/WolfInsect.cpp -o host_sim
            ./host_sim logic | grep -v "\[alert\]"
            ./host_sim mix | grep -E "STUCK|stage"
            ./host_sim egg | grep -v "\[alert\]"
            ./host_sim mirror mirror.txt
            g++ -std=c++17 -I src -I mc/src -I test -DPET_$SP=1 test/cross_sim.cpp src/WolfCore.cpp -o cross_sim
            ./cross_sim | grep -v "\[alert\]" | tail -8
          fi

      - name: Apply ORION, then the wolf
        run: |
          S="${{ inputs.species }}"
          if [ "${{ inputs.tactical }}" = true ] && [ "$S" = mesh ]; then echo "::error::tactical needs a pet species (the radar shares the pet screen); use mysterymesh or a pet"; exit 1; fi
          python3 orion/tools/apply_nova.py --meshcore mc
          case "$S" in
            mesh) ;;
            mystery|mysterymesh) python3 tools/apply_orion_wolf.py --meshcore mc --mystery ;;
            *) python3 tools/apply_orion_wolf.py --meshcore mc ;;
          esac
          if [ "$S" = mesh ] || [ "$S" = mysterymesh ] || [ "${{ inputs.mesh }}" = true ] || [ "${{ inputs.tactical }}" = true ]; then python3 tools/apply_orion_mesh.py --meshcore mc; fi
          if [ "${{ inputs.tactical }}" = true ]; then
            python3 tools/apply_orion_tactical.py --meshcore mc
          fi

      - name: Build firmware
        env:
          SPECIES: ${{ inputs.species }}
          UNITS: ${{ inputs.units }}
        run: |
          set -o pipefail
          SP=$(echo "$SPECIES" | tr a-z A-Z)
          PETFLAG="-DPET_$SP=1"
          [ "$SP" = MYSTERYMESH ] && PETFLAG="-DPET_MYSTERY=1"
          [ "$SP" = MESH ] && PETFLAG=""
          [ "${{ inputs.instant }}" = true ] && PETFLAG="$PETFLAG -DPET_INSTANT=1"
          export PLATFORMIO_BUILD_FLAGS="-DNOVA_ORION=1 $PETFLAG $([ "$UNITS" = mph ] && echo -DNOVA_MPH=1) $([ "${{ inputs.tactical }}" = true ] && echo -DTACTICAL=1)"
          echo "flags: $PLATFORMIO_BUILD_FLAGS"
          pip install platformio
          cd mc
          if [ "${{ inputs.kind }}" = esp32 ]; then pio run -e "$PIO_ENV" -t mergebin 2>&1 | tee ../build.log; else pio run -e "$PIO_ENV" 2>&1 | tee ../build.log; fi

      - name: Show compile errors
        if: failure()
        run: |
          { grep -E "error|overflow|will not fit|region|FAILED|undefined reference|No such file" build.log; tail -n 12 build.log; } | head -40 | while IFS= read -r l; do
            echo "::error::${l:0:900}"
          done

      - name: Collect output
        run: |
          mkdir -p out
          B=mc/.pio/build/"$PIO_ENV"
          echo "::notice::build dir: $(ls $B | tr '\n' ' ' | cut -c1-600)"
          if [ "${{ inputs.kind }}" = esp32 ]; then
            cp $B/firmware-merged.bin out/
            cp $B/firmware.bin out/
          else
            cp $B/firmware.uf2 out/ 2>/dev/null || true
            cp $B/firmware.zip out/ 2>/dev/null || true
            cp $B/firmware.hex out/ 2>/dev/null || true
            ls out | grep -q . || { echo "::error::no firmware files found"; exit 1; }
          fi
          git -C mc rev-parse HEAD > out/meshcore_commit.txt
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: orion-${{ inputs.species }}${{ inputs.tactical && '-tactical' || '' }}-${{ inputs.board }}-${{ inputs.units }}
          path: out/

      - name: Publish release (private repo)
        if: ${{ inputs.release_tag != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag }}
          UNITS: ${{ inputs.units }}
          SPECIES: ${{ inputs.species }}
          BOARD: ${{ inputs.board }}
          KIND: ${{ inputs.kind }}
        run: |
          P="orion-$SPECIES-$BOARD-$UNITS"
          TACT="${{ inputs.tactical }}"; [ "$TACT" = true ] && P="orion-$SPECIES-tactical-$BOARD-$UNITS"
          if [ "$KIND" = esp32 ]; then
            cp out/firmware-merged.bin "$P-merged.bin"; cp out/firmware.bin "$P-update.bin"; FILES="$P-merged.bin $P-update.bin"
          else
            FILES=""
            if [ -f out/firmware.uf2 ]; then cp out/firmware.uf2 "$P.uf2"; FILES="$P.uf2"; fi
            if [ -f out/firmware.zip ]; then cp out/firmware.zip "$P-update.zip"; FILES="$FILES $P-update.zip"; fi
            if [ -f out/firmware.hex ]; then cp out/firmware.hex "$P.hex"; FILES="$FILES $P.hex"; fi
          fi
          gh release create "$TAG" $FILES --title "ORION + $SPECIES ($BOARD, $UNITS)" \
            --notes "LODESTAR ORION, $SPECIES build. Radio: $BOARD."
